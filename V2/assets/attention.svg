<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img">
<title>注意力：先决定比例，再传递内容</title>
<rect width="100%" height="100%" fill="white"/>
<text x="45" y="68" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="38" font-weight="700" fill="#142e45">注意力：先决定比例，再传递内容</text>
<text x="45" y="109" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">本图省略批次和多头轴；每行对应一个接收位置。</text>
<rect x="40" y="300" width="190" height="120" rx="14" fill="#e9f3ff" stroke="#69829a" stroke-width="2"/>
<text x="54" y="341" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">输入 X</text>
<text x="54" y="381" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">n × d</text>
<rect x="335" y="150" width="215" height="105" rx="14" fill="#e9f3ff" stroke="#69829a" stroke-width="2"/>
<text x="349" y="191" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">Q = XWQ</text>
<text x="349" y="231" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">n × dk</text>
<rect x="335" y="310" width="215" height="105" rx="14" fill="#e9f3ff" stroke="#69829a" stroke-width="2"/>
<text x="349" y="351" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">K = XWK</text>
<text x="349" y="391" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">n × dk</text>
<rect x="335" y="505" width="215" height="105" rx="14" fill="#e9f3ff" stroke="#69829a" stroke-width="2"/>
<text x="349" y="546" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">V = XWV</text>
<text x="349" y="586" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">n × dv</text>
<rect x="665" y="260" width="235" height="150" rx="14" fill="#e9f3ff" stroke="#69829a" stroke-width="2"/>
<text x="679" y="301" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">分数 S</text>
<text x="679" y="341" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">QKᵀ / √dk</text>
<text x="679" y="375" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">n × n</text>
<rect x="1000" y="260" width="255" height="150" rx="14" fill="#e9f3ff" stroke="#69829a" stroke-width="2"/>
<text x="1014" y="301" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">权重 A</text>
<text x="1014" y="340" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#4f6375">掩码 + 逐行 Softmax</text>
<text x="1014" y="374" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">n × n</text>
<rect x="1330" y="405" width="230" height="140" rx="14" fill="#e9f3ff" stroke="#69829a" stroke-width="2"/>
<text x="1344" y="446" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">输出 O</text>
<text x="1344" y="486" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">O = AV</text>
<text x="1344" y="520" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">n × dv</text>
<polyline points="230,360 280,360 280,202 335,202" fill="none" stroke="#69829a" stroke-width="3"/>
<polygon points="335,202 323.5914266954251,208.23253200185465 323.5914266954251,195.76746799814535" fill="#69829a"/>
<polyline points="230,360 335,360" fill="none" stroke="#69829a" stroke-width="3"/>
<polygon points="335,360 323.5914266954251,366.2325320018546 323.5914266954251,353.7674679981454" fill="#69829a"/>
<polyline points="230,360 280,360 280,557 335,557" fill="none" stroke="#69829a" stroke-width="3"/>
<polygon points="335,557 323.5914266954251,563.2325320018547 323.5914266954251,550.7674679981453" fill="#69829a"/>
<polyline points="550,202 615,202 615,305 665,305" fill="none" stroke="#69829a" stroke-width="3"/>
<polygon points="665,305 653.5914266954252,311.2325320018546 653.5914266954252,298.7674679981454" fill="#69829a"/>
<polyline points="550,362 665,362" fill="none" stroke="#69829a" stroke-width="3"/>
<polygon points="665,362 653.5914266954252,368.2325320018546 653.5914266954252,355.7674679981454" fill="#69829a"/>
<polyline points="900,335 1000,335" fill="none" stroke="#69829a" stroke-width="3"/>
<polygon points="1000,335 988.5914266954252,341.2325320018546 988.5914266954252,328.7674679981454" fill="#69829a"/>
<polyline points="1255,335 1445,335 1445,405" fill="none" stroke="#69829a" stroke-width="3"/>
<polygon points="1445,405 1438.7674679981453,393.5914266954252 1451.2325320018547,393.5914266954251" fill="#69829a"/>
<polyline points="550,557 1210,557 1210,475 1330,475" fill="none" stroke="#69829a" stroke-width="3"/>
<polygon points="1330,475 1318.591426695425,481.2325320018546 1318.591426695425,468.7674679981454" fill="#69829a"/>
<text x="45" y="663" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#4f6375">WQ、WK、WV 是参数；Q、K、V 和 A 随当前输入变化。</text>
<text x="45" y="697" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#4f6375">注意力 Softmax 沿位置归一化；输出词表的 Softmax 是另一处运算。</text>
</svg>