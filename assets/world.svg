<text x="45" y="458" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#4f6375">虚拟轨迹可能利用模型误差；真实闭环成功不能只由生成视频的观感证明。</text>
