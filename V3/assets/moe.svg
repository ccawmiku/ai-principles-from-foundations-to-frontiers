<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img">
<title>稀疏专家：选择内部模块，不是让完整模型投票</title>
<rect width="100%" height="100%" fill="white"/>
<text x="45" y="68" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="38" font-weight="700" fill="#142e45">稀疏专家：选择内部模块，不是让完整模型投票</text>
<text x="45" y="109" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">一个 token 可以在不同层被路由到不同专家。</text>
<rect x="45" y="295" width="205" height="140" rx="14" fill="#e9f3ff" stroke="#69829a" stroke-width="2"/>
<text x="59" y="336" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">当前表示 x</text>
<text x="59" y="376" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">单个 token</text>
<rect x="325" y="295" width="250" height="140" rx="14" fill="#f0eafb" stroke="#69829a" stroke-width="2"/>
<text x="339" y="336" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">路由器</text>
<text x="339" y="376" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">计算各专家分数</text>
<text x="339" y="410" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">选择 Top-k</text>
<rect x="740" y="145" width="270" height="105" rx="14" fill="#e9f3ff" stroke="#69829a" stroke-width="2"/>
<text x="754" y="186" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">专家 1</text>
<text x="754" y="226" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">独立 FFN 参数</text>
<rect x="740" y="285" width="270" height="105" rx="14" fill="#e9f3ff" stroke="#69829a" stroke-width="2"/>
<text x="754" y="326" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">专家 2</text>
<text x="754" y="366" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">独立 FFN 参数</text>
<rect x="740" y="425" width="270" height="105" rx="14" fill="#f0f3f6" stroke="#69829a" stroke-width="2"/>
<text x="754" y="466" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">专家 3</text>
<text x="754" y="506" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">独立 FFN 参数</text>
<rect x="740" y="565" width="270" height="105" rx="14" fill="#f0f3f6" stroke="#69829a" stroke-width="2"/>
<text x="754" y="606" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">专家 4</text>
<text x="754" y="646" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">独立 FFN 参数</text>
<rect x="1190" y="295" width="265" height="145" rx="14" fill="#e7f4ed" stroke="#69829a" stroke-width="2"/>
<text x="1204" y="336" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="700" fill="#142e45">加权合并</text>
<text x="1204" y="376" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">输出回到 d 维</text>
<text x="1204" y="410" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#4f6375">再进入残差流</text>
